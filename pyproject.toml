[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mastfit"
version = "1.6.0"
description = "Deterministic generalized-cylinder fitting for mast deformation from UAV point clouds"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Ana Kuzmanic Skelin" },
  { name = "Mirjana Bonkovic" },
  { name = "Mario Milicevic" },
  { name = "Mojmil Cecic" },
]
keywords = ["photogrammetry", "point-cloud", "cylinder-fitting", "structural-health", "UAV"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["mastfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
